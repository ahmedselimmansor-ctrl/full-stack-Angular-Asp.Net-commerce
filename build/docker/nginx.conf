server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The Server header hands an attacker a free version match against known CVEs.
    server_tokens off;

    # Compressed at the origin as a fallback; Cloud CDN normally compresses at the edge.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Probed by Kubernetes; must not be rewritten into index.html by the SPA fallback below.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Runtime configuration. Never cached: it is how a rebuilt-once bundle is pointed at a
    # different API, and a cached copy would pin an environment to the wrong backend.
    location = /config.json {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Build output is content-hashed, so a given URL's bytes never change. Immutable tells the
    # browser not to even revalidate.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico|webp|avif)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # index.html is the one file that must always be fresh: it names the current hashed
    # bundles, so a stale copy would keep loading a previous deployment.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Client-side routing: unknown paths are application routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The API's own responses carry a far stricter policy; this one governs the document.
    # 'unsafe-inline' for styles is required by Angular's component style injection.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-7t0SFukNoeiQn2XII6c8PMltKqrJshL8afZmoxeE4Dc='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
}
