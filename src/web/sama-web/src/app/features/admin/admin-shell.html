<div class="admin">
  <aside class="rail" [class.is-open]="navOpen()">
    <div class="rail__head">
      <p class="rail__title">{{ 'admin.title' | t }}</p>
      <p class="rail__who">{{ auth.displayName() }}</p>
    </div>

    <nav class="rail__nav" [attr.aria-label]="'admin.title' | t">
      @for (link of links; track link.path) {
        <a
          *samaHasPermission="link.permissions"
          class="rail__link"
          [routerLink]="link.path"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: link.path === '' }"
          (click)="closeNav()"
        >
          <svg viewBox="0 0 20 20" aria-hidden="true" [innerHTML]="link.icon"></svg>
          <span>{{ link.label | t }}</span>
        </a>
      }
    </nav>

    <div class="rail__foot">
      <div class="rail__prefs">
        <app-locale-toggle />
        <app-theme-toggle />
      </div>

      <a class="rail__exit" routerLink="/" (click)="closeNav()">
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path d="M16 10H5M9 6l-4 4 4 4" />
        </svg>
        <span>{{ 'admin.backToShop' | t }}</span>
      </a>
    </div>
  </aside>

  <section class="content">
    <button
      type="button"
      class="btn btn--ghost btn--sm content__nav-toggle"
      [attr.aria-expanded]="navOpen()"
      (click)="toggleNav()"
    >
      {{ (navOpen() ? 'nav.close' : 'admin.title') | t }}
    </button>

    <router-outlet />
  </section>
</div>
