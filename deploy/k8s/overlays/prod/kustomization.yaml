apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Environments are separated by namespace rather than by a name suffix.
#
# A nameSuffix renames the ExternalSecret *resource* but not the `spec.target.name` inside it,
# so the Secret it actually creates would keep the unsuffixed name while the Deployments
# referenced the suffixed one — a mismatch that only shows up as pods failing to start.

namespace: sama

resources:
  - ../../base

# Production runs the replica counts the base declares, with autoscaling headroom above them.
patches:
  - target:
      kind: Deployment
      name: sama-gateway
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: HorizontalPodAutoscaler
      name: sama-gateway
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 30
  # Two pods minimum for every service, so a node drain never leaves a single point of failure.
  - target:
      kind: PodDisruptionBudget
      labelSelector: app.kubernetes.io/part-of=sama
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 2

configMapGenerator:
  - name: sama-shared
    behavior: merge
    literals:
      - PubSub__TopicPrefix=sama-prod
      - Telemetry__SamplingRatio=0.05
