apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Environments are separated by namespace rather than by a name suffix.
#
# A nameSuffix renames the ExternalSecret *resource* but not the `spec.target.name` inside it,
# so the Secret it actually creates would keep the unsuffixed name while the Deployments
# referenced the suffixed one — a mismatch that only shows up as pods failing to start.

namespace: sama-dev

resources:
  - ../../base

patches:
  # A single replica per service, and no disruption budget standing in the way of a node
  # drain — dev availability is not worth blocking cluster maintenance for.
  - target:
      kind: Deployment
      labelSelector: app.kubernetes.io/part-of=sama
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: HorizontalPodAutoscaler
      labelSelector: app.kubernetes.io/part-of=sama
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 3
  - target:
      kind: PodDisruptionBudget
      labelSelector: app.kubernetes.io/part-of=sama
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 0

configMapGenerator:
  - name: sama-shared
    behavior: merge
    literals:
      - PubSub__TopicPrefix=sama-dev
      - Telemetry__SamplingRatio=1.0
      - Serilog__MinimumLevel__Default=Debug

# The Namespace object is cluster-scoped, so the `namespace:` field above does not rename it.
patches:
  - target: { kind: Namespace, name: sama }
    patch: |-
      - op: replace
        path: /metadata/name
        value: sama-dev
