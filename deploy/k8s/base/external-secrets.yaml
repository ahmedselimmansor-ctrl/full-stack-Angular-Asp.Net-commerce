# Secrets never live in Git. Each of these declares only *which* secret a service expects;
# External Secrets Operator reads the values from Google Secret Manager using Workload
# Identity and materialises them as Kubernetes Secrets.
#
# Every service gets its own database credential rather than a shared one, so the
# schema-level isolation the database is configured for is not undone by a single connection
# string that can reach everything.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sama-gateway-secrets
  namespace: sama
spec:
  # Re-read periodically so a rotated secret reaches the pods without a manual redeploy.
  refreshInterval: 1h
  secretStoreRef:
    name: sama-gcp
    kind: SecretStore
  target:
    name: sama-gateway-secrets
    creationPolicy: Owner
  data:
    - secretKey: Redis__ConnectionString
      remoteRef:
        key: sama-gateway-redis-connectionstring
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sama-identity-secrets
  namespace: sama
spec:
  # Re-read periodically so a rotated secret reaches the pods without a manual redeploy.
  refreshInterval: 1h
  secretStoreRef:
    name: sama-gcp
    kind: SecretStore
  target:
    name: sama-identity-secrets
    creationPolicy: Owner
  data:
    - secretKey: ConnectionStrings__Postgres
      remoteRef:
        key: sama-identity-connectionstrings-postgres
    - secretKey: Redis__ConnectionString
      remoteRef:
        key: sama-identity-redis-connectionstring
    - secretKey: Signing__ActiveKeyId
      remoteRef:
        key: sama-identity-signing-activekeyid
    - secretKey: Signing__Keys__0__KeyId
      remoteRef:
        key: sama-identity-signing-keys-0-keyid
    - secretKey: Signing__Keys__0__PrivateKeyPem
      remoteRef:
        key: sama-identity-signing-keys-0-privatekeypem
---
