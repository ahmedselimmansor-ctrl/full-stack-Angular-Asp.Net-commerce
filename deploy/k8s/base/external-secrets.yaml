apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sama-migrations-secrets
  namespace: sama
spec:
  # Re-read periodically so a rotated secret reaches the pods without a manual redeploy.
  refreshInterval: 1h
  secretStoreRef:
    name: sama-gcp
    kind: SecretStore
  target:
    name: sama-migrations-secrets
    creationPolicy: Owner
  data:
    # One credential per schema owner: each bundle connects as the role that owns the schema
    # it is migrating.
    - secretKey: SAMA_DB_IDENTITY
      remoteRef:
        key: sama-identity-connectionstrings-postgres
    - secretKey: SAMA_DB_CATALOG
      remoteRef:
        key: sama-catalog-connectionstrings-postgres
    - secretKey: SAMA_DB_ORDERING
      remoteRef:
        key: sama-ordering-connectionstrings-postgres
    - secretKey: SAMA_DB_INVENTORY
      remoteRef:
        key: sama-inventory-connectionstrings-postgres
    - secretKey: SAMA_DB_PAYMENT
      remoteRef:
        key: sama-payment-connectionstrings-postgres
