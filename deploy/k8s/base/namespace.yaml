apiVersion: v1
kind: Namespace
metadata:
  name: sama
  labels:
    app.kubernetes.io/part-of: sama
    # Enforces the restricted Pod Security Standard: no privilege escalation, no host
    # namespaces, non-root only. A workload that violates it is rejected at admission rather
    # than discovered later by an audit.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sama-workload
  namespace: sama
  annotations:
    # Workload Identity: pods authenticate to Google Cloud as this service account, so no
    # service-account JSON key exists to leak, rotate, or accidentally commit.
    iam.gke.io/gcp-service-account: PLACEHOLDER_GSA_EMAIL
automountServiceAccountToken: true
