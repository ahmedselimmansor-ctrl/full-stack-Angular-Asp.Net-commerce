name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push supersedes an in-flight run on the same branch; there is no value in finishing
# a build for a commit that has already been replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # No service containers: the integration suite starts its own PostgreSQL and Redis through
    # Testcontainers, so it controls their lifecycle and cannot collide with a shared one.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet restore Sama.slnx

      # -warnaserror in CI as well as locally, so a warning cannot accumulate unnoticed on a
      # machine where someone has it configured differently.
      - run: dotnet build Sama.slnx --configuration Release --no-restore -warnaserror

      - name: Unit tests
        run: dotnet test tests/Sama.UnitTests/Sama.UnitTests.csproj --configuration Release --no-build

      - name: Integration tests
        # Starts real PostgreSQL and Redis in containers. Slower than the unit suite, and the
        # only thing that proves query filters translate to SQL and the Lua scripts are atomic.
        run: dotnet test tests/Sama.IntegrationTests/Sama.IntegrationTests.csproj --configuration Release --no-build

  frontend:
    name: Storefront build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/web/sama-web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/web/sama-web/package-lock.json

      # ci, not install: fails when package-lock.json disagrees with package.json rather than
      # quietly resolving to something that was never tested.
      - run: npm ci --no-audit --no-fund

      - name: Unit tests
        run: npm run test -- --watch=false

      # The inline theme script in index.html is allowed by a SHA-256 hash rather
      # than 'unsafe-inline'. Editing the script without updating the hash blocks
      # it in production while everything still works locally, because the dev
      # server sets no CSP at all.
      - name: Content-Security-Policy hash is current
        working-directory: .
        run: ./scripts/check-csp-hash.sh

      # Contrast is the one part of a design system that can be measured rather
      # than argued about, and it is also the part that fails quietly: a muted
      # grey that looks fine on the author's monitor can sit at 2.6:1.
      - name: Design tokens meet WCAG AA contrast
        working-directory: .
        run: ./scripts/check-contrast.py

      - run: npm run build -- --configuration production

  android:
    name: Android app build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src/mobile/sama-android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Build debug and release
        # Release too, not just debug: R8 only runs on release, and it is where a missing
        # keep rule turns into a crash that no debug build would ever reveal.
        run: ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: sama-android-release
          path: src/mobile/sama-android/app/build/outputs/apk/release/*.apk
          retention-days: 14

  manifests:
    name: Deployment manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.3

      - name: Terraform format and validate
        working-directory: deploy/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

      - name: Build every Kustomize overlay
        run: |
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz" \
            | tar xz -C /usr/local/bin
          for env in dev staging prod; do
            echo "==> $env"
            kustomize build "deploy/k8s/overlays/$env" > /dev/null
          done

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Start dependencies
        run: |
          docker compose up -d
          # The emulator holds topics in memory, so they are created after it is up.
          timeout 90 bash -c 'until docker exec sama-postgres pg_isready -U sama; do sleep 2; done'

      - name: Apply migrations
        run: |
          dotnet tool restore
          for service in Identity Catalog Ordering Inventory Payment; do
            dotnet dotnet-ef database update \
              --project "src/services/Sama.$service/Sama.$service.csproj"
          done

      - name: Start the platform
        run: |
          ./scripts/run-local.sh start

      - name: Build and serve the storefront
        working-directory: src/web/sama-web
        run: |
          npm ci --no-audit --no-fund
          npm start -- --port 4200 --host 127.0.0.1 &
          timeout 180 bash -c 'until curl -sf http://127.0.0.1:4200 >/dev/null; do sleep 3; done'

      - name: Run the suite
        working-directory: tests/e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 14

      - name: Service logs on failure
        if: failure()
        run: tail -n 200 .logs/*.log

  images:
    name: Container images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend]

    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gateway,   dockerfile: Dockerfile.service, service: Sama.Gateway, path: gateway }
          - { name: identity,  dockerfile: Dockerfile.service, service: Sama.Identity }
          - { name: catalog,   dockerfile: Dockerfile.service, service: Sama.Catalog }
          - { name: basket,    dockerfile: Dockerfile.service, service: Sama.Basket }
          - { name: ordering,  dockerfile: Dockerfile.service, service: Sama.Ordering }
          - { name: inventory, dockerfile: Dockerfile.service, service: Sama.Inventory }
          - { name: payment,   dockerfile: Dockerfile.service, service: Sama.Payment }
          - { name: web,       dockerfile: Dockerfile.web }
          - { name: migrations, dockerfile: Dockerfile.migrations }

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build only on a pull request; publishing happens in the deploy workflow, which runs
      # with the credentials this one deliberately does not have.
      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/docker/${{ matrix.dockerfile }}
          push: false
          load: true
          tags: sama/${{ matrix.name }}:${{ github.sha }}
          build-args: |
            SERVICE=${{ matrix.service }}
            SERVICE_PATH=${{ matrix.path || 'services' }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Scan ${{ matrix.name }} for vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: sama/${{ matrix.name }}:${{ github.sha }}
          format: table
          # Fails the build on a fixable high or critical finding. Unfixed ones are reported
          # but do not block, since there is nothing the pipeline could do about them.
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
